<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Database System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .coach-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .coach-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.1);
        }
        .filter-btn {
            transition: all 0.2s ease;
        }
        .filter-btn.active {
            background: rgba(59, 130, 246, 0.3);
            color: #3b82f6;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="glass rounded-2xl p-8 mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-4xl font-bold text-white mb-2 flex items-center gap-3">
                        <i data-lucide="database" class="w-10 h-10"></i>
                        Coach Database System
                    </h1>
                    <p class="text-zinc-400">Comprehensive coaching analytics and career statistics</p>
                </div>
                <div class="text-right">
                    <div class="text-3xl font-bold text-white" id="totalCoaches">-</div>
                    <div class="text-sm text-zinc-400">Total Coaches</div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="glass rounded-2xl p-6 mb-6">
            <div class="flex items-center gap-4 mb-4">
                <i data-lucide="filter" class="w-5 h-5 text-zinc-400"></i>
                <h2 class="text-lg font-semibold text-white">Filter Coaches</h2>
            </div>
            <div class="flex flex-wrap gap-3">
                <button onclick="filterCoaches('all')" id="filter-all" class="filter-btn active px-4 py-2 rounded-lg border border-white/20 text-white font-medium">
                    All Coaches
                </button>
                <button onclick="filterCoaches('active')" id="filter-active" class="filter-btn px-4 py-2 rounded-lg border border-white/20 text-zinc-400 font-medium">
                    Active (2025)
                </button>
                <button onclick="filterCoaches('former')" id="filter-former" class="filter-btn px-4 py-2 rounded-lg border border-white/20 text-zinc-400 font-medium">
                    Former
                </button>
                <button onclick="filterCoaches('p5')" id="filter-p5" class="filter-btn px-4 py-2 rounded-lg border border-white/20 text-zinc-400 font-medium">
                    Power 5
                </button>
                <button onclick="filterCoaches('g5')" id="filter-g5" class="filter-btn px-4 py-2 rounded-lg border border-white/20 text-zinc-400 font-medium">
                    Group of 5
                </button>
            </div>
            
            <!-- Search -->
            <div class="mt-4">
                <div class="relative">
                    <i data-lucide="search" class="w-5 h-5 text-zinc-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search coaches by name or school..."
                        class="w-full pl-10 pr-4 py-3 rounded-lg bg-white/5 border border-white/10 text-white placeholder-zinc-500 focus:outline-none focus:border-blue-500"
                        oninput="searchCoaches()"
                    >
                </div>
            </div>
        </div>

        <!-- Coach Cards Grid -->
        <div id="coachesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading state -->
            <div class="col-span-full text-center py-12 text-zinc-400">
                <i data-lucide="loader" class="w-8 h-8 mx-auto mb-2 animate-spin"></i>
                <p>Loading coaches...</p>
            </div>
        </div>
    </div>

    <script>
        let allCoaches = [];
        let currentFilter = 'all';

        async function loadCoaches() {
            try {
                const response = await fetch('/api/coaches');
                const coaches = await response.json();
                
                // Expand to show all potential coaches with data flags
                allCoaches = coaches.map(coach => ({
                    ...coach,
                    has_data: coach.id === 1, // Only Matt Campbell has full data for now
                    is_active: coach.current_school ? true : false,
                    conference_level: coach.current_school === 'Iowa State' ? 'P5' : 'G5'
                }));
                
                document.getElementById('totalCoaches').textContent = allCoaches.length;
                renderCoaches();
                lucide.createIcons();
            } catch (error) {
                console.error('Error loading coaches:', error);
            }
        }

        function filterCoaches(type) {
            currentFilter = type;
            
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.classList.add('text-zinc-400');
            });
            document.getElementById(`filter-${type}`).classList.add('active');
            document.getElementById(`filter-${type}`).classList.remove('text-zinc-400');
            
            renderCoaches();
        }

        function searchCoaches() {
            renderCoaches();
        }

        function renderCoaches() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allCoaches.filter(coach => {
                // Apply filter
                if (currentFilter === 'active' && !coach.is_active) return false;
                if (currentFilter === 'former' && coach.is_active) return false;
                if (currentFilter === 'p5' && coach.conference_level !== 'P5') return false;
                if (currentFilter === 'g5' && coach.conference_level !== 'G5') return false;
                
                // Apply search
                if (searchTerm) {
                    const matchName = coach.name.toLowerCase().includes(searchTerm);
                    const matchSchool = coach.current_school && coach.current_school.toLowerCase().includes(searchTerm);
                    if (!matchName && !matchSchool) return false;
                }
                
                return true;
            });

            const grid = document.getElementById('coachesGrid');
            
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-zinc-400">
                        <i data-lucide="user-x" class="w-12 h-12 mx-auto mb-3"></i>
                        <p class="text-lg">No coaches found</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = filtered.map(coach => `
                <div class="coach-card glass rounded-xl p-6" onclick="viewCoach(${coach.id})">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-full overflow-hidden bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center">
                                ${coach.headshot_url ? 
                                    `<img 
                                        src="${coach.headshot_url}" 
                                        alt="${coach.name}"
                                        class="w-full h-full object-cover"
                                        onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\\'text-white font-bold text-xl\\'>${coach.name.split(' ').map(n => n[0]).join('')}</span>';"
                                    >` :
                                    `<span class="text-white font-bold text-xl">${coach.name.split(' ').map(n => n[0]).join('')}</span>`
                                }
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-white">${coach.name}</h3>
                                <p class="text-sm text-zinc-400">${coach.current_school || 'Former Coach'}</p>
                            </div>
                        </div>
                        ${coach.has_data ? 
                            '<span class="px-2 py-1 text-xs rounded-full bg-green-500/20 text-green-400 font-semibold">DATA AVAILABLE</span>' :
                            '<span class="px-2 py-1 text-xs rounded-full bg-zinc-500/20 text-zinc-400 font-semibold">COMING SOON</span>'
                        }
                    </div>
                    
                    <div class="space-y-2 mb-4">
                        <div class="flex items-center justify-between">
                            <span class="text-zinc-400 text-sm flex items-center gap-2">
                                <i data-lucide="trophy" class="w-4 h-4"></i>
                                Record
                            </span>
                            <span class="text-white font-semibold">${coach.career_record || '0-0'}</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-zinc-400 text-sm flex items-center gap-2">
                                <i data-lucide="percent" class="w-4 h-4"></i>
                                Win %
                            </span>
                            <span class="text-white font-semibold">${coach.career_win_pct || '0'}%</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-zinc-400 text-sm flex items-center gap-2">
                                <i data-lucide="calendar" class="w-4 h-4"></i>
                                Games
                            </span>
                            <span class="text-white font-semibold">${coach.total_games}</span>
                        </div>
                    </div>
                    
                    <div class="pt-4 border-t border-white/10 flex items-center justify-between">
                        <span class="text-zinc-500 text-xs">Click to view details</span>
                        <i data-lucide="chevron-right" class="w-5 h-5 text-zinc-500"></i>
                    </div>
                </div>
            `).join('');
            
            lucide.createIcons();
        }

        function viewCoach(coachId) {
            // Redirect to coach-specific page
            window.location.href = `/coach/${coachId}`;
        }

        // Initialize
        loadCoaches();
    </script>
</body>
</html>
