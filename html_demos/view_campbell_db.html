<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt Campbell Database Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .table-container {
            max-height: 600px;
            overflow-y: auto;
        }
        table {
            font-size: 0.85rem;
        }
        th {
            position: sticky;
            top: 0;
            background: rgba(30, 30, 50, 0.95);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .icon-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .win-badge { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .loss-badge { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .ranked-badge { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
        .signature-badge { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
        .neutral-badge { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }
        .home-badge { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .away-badge { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .conference-badge { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .stat-positive { color: #22c55e; font-weight: 600; }
        .stat-negative { color: #ef4444; font-weight: 600; }
        .stat-neutral { color: #94a3b8; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="glass rounded-2xl p-8 mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-4xl font-bold text-white mb-2">Matt Campbell Database</h1>
                    <p class="text-zinc-400">campbell_test.db • Full Career Data + Advanced Analytics</p>
                </div>
                <div class="text-right">
                    <div class="text-3xl font-bold text-white" id="totalGames">177</div>
                    <div class="text-sm text-zinc-400">Total Games</div>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-4 gap-4 mb-6">
            <div class="glass rounded-xl p-6">
                <div class="text-zinc-400 text-sm mb-1">Wins</div>
                <div class="text-3xl font-bold text-green-400" id="totalWins">107</div>
            </div>
            <div class="glass rounded-xl p-6">
                <div class="text-zinc-400 text-sm mb-1">Losses</div>
                <div class="text-3xl font-bold text-red-400" id="totalLosses">70</div>
            </div>
            <div class="glass rounded-xl p-6">
                <div class="text-zinc-400 text-sm mb-1">Win %</div>
                <div class="text-3xl font-bold text-white" id="winPct">60.5%</div>
            </div>
            <div class="glass rounded-xl p-6">
                <div class="text-zinc-400 text-sm mb-1">Span</div>
                <div class="text-3xl font-bold text-white">2011-2025</div>
            </div>
        </div>

        <!-- Tables Tabs -->
        <div class="glass rounded-2xl p-6 mb-6">
            <div class="flex gap-3 mb-6 border-b border-white/10 pb-4 overflow-x-auto">
                <button onclick="showTable('coaches')" id="tab-coaches" class="px-4 py-2 rounded-lg bg-white/10 text-white font-medium whitespace-nowrap">Coaches (1)</button>
                <button onclick="showTable('stints')" id="tab-stints" class="px-4 py-2 rounded-lg text-zinc-400 hover:text-white whitespace-nowrap">Stints (2)</button>
                <button onclick="showTable('games')" id="tab-games" class="px-4 py-2 rounded-lg text-zinc-400 hover:text-white whitespace-nowrap">Games (177)</button>
                <button onclick="showTable('rankings')" id="tab-rankings" class="px-4 py-2 rounded-lg text-zinc-400 hover:text-white whitespace-nowrap">Rankings</button>
                <button onclick="showTable('draft_picks')" id="tab-draft_picks" class="px-4 py-2 rounded-lg text-zinc-400 hover:text-white whitespace-nowrap">Draft Picks</button>
                <button onclick="showTable('situational_stats')" id="tab-situational_stats" class="px-4 py-2 rounded-lg text-zinc-400 hover:text-white whitespace-nowrap">Situational Stats</button>
                <button onclick="showTable('vs_coaches')" id="tab-vs_coaches" class="px-4 py-2 rounded-lg text-zinc-400 hover:text-white whitespace-nowrap">vs Coaches</button>
                <button onclick="showTable('season_analytics')" id="tab-season_analytics" class="px-4 py-2 rounded-lg text-zinc-400 hover:text-white whitespace-nowrap">Season Analytics</button>
                <button onclick="showTable('recruiting_classes')" id="tab-recruiting_classes" class="px-4 py-2 rounded-lg text-zinc-400 hover:text-white whitespace-nowrap">Recruiting</button>
                <button onclick="showTable('talent_composite')" id="tab-talent_composite" class="px-4 py-2 rounded-lg text-zinc-400 hover:text-white whitespace-nowrap">Talent</button>
                <button onclick="showTable('transfer_portal')" id="tab-transfer_portal" class="px-4 py-2 rounded-lg text-zinc-400 hover:text-white whitespace-nowrap">Transfer Portal</button>
            </div>

            <div id="table-content" class="table-container">
                <div class="text-zinc-400 text-center py-8">Loading data...</div>
            </div>
        </div>
    </div>

    <script>
        let currentData = {};
        
        async function loadData() {
            const tables = ['coaches', 'stints', 'games', 'rankings', 'draft_picks', 
                          'situational_stats', 'vs_coaches', 'season_analytics', 
                          'recruiting_classes', 'talent_composite', 'transfer_portal'];
            
            for (const table of tables) {
                const response = await fetch(`/api/${table}`);
                currentData[table] = await response.json();
                
                // Update tab counts
                const tabBtn = document.getElementById(`tab-${table}`);
                if (tabBtn) {
                    const count = currentData[table].length;
                    tabBtn.textContent = tabBtn.textContent.split('(')[0] + `(${count})`;
                }
            }
            
            // Load stats
            const statsResponse = await fetch('/api/stats');
            const stats = await statsResponse.json();
            document.getElementById('totalGames').textContent = stats.total_games;
            document.getElementById('totalWins').textContent = stats.wins;
            document.getElementById('totalLosses').textContent = stats.losses;
            document.getElementById('winPct').textContent = stats.win_pct + '%';
            
            // Show first table
            showTable('coaches');
        }
        
        function formatValue(key, value, row) {
            if (value === null || value === undefined) return '<span class="stat-neutral">-</span>';
            
            // Result badges (W/L)
            if (key === 'result') {
                if (value === 'W') return '<span class="icon-badge win-badge"><i data-lucide="check-circle" class="w-3 h-3"></i>WIN</span>';
                if (value === 'L') return '<span class="icon-badge loss-badge"><i data-lucide="x-circle" class="w-3 h-3"></i>LOSS</span>';
            }
            
            // Boolean indicators
            if (key === 'is_home' || key === 'is_neutral' || key === 'is_conference' || key === 'is_signature') {
                if (value === 1 || value === true) {
                    if (key === 'is_home') return '<span class="icon-badge home-badge"><i data-lucide="home" class="w-3 h-3"></i>HOME</span>';
                    if (key === 'is_neutral') return '<span class="icon-badge neutral-badge"><i data-lucide="map-pin" class="w-3 h-3"></i>NEUTRAL</span>';
                    if (key === 'is_conference') return '<span class="icon-badge conference-badge"><i data-lucide="shield" class="w-3 h-3"></i>CONF</span>';
                    if (key === 'is_signature') return '<span class="icon-badge signature-badge"><i data-lucide="star" class="w-3 h-3"></i>SIGNATURE</span>';
                }
                return '<span class="stat-neutral">-</span>';
            }
            
            // Away games
            if (key === 'is_home' && value === 0) {
                return '<span class="icon-badge away-badge"><i data-lucide="plane" class="w-3 h-3"></i>AWAY</span>';
            }
            
            // Scores with color coding
            if ((key === 'coach_score' || key === 'opponent_score') && row.result) {
                const isWin = row.result === 'W';
                const isCoachScore = key === 'coach_score';
                if ((isWin && isCoachScore) || (!isWin && !isCoachScore)) {
                    return `<span class="stat-positive">${value}</span>`;
                } else {
                    return `<span class="stat-negative">${value}</span>`;
                }
            }
            
            // Record strings
            if (key === 'record' || key.includes('_record')) {
                const [wins, losses] = value.split('-').map(Number);
                if (wins > losses) return `<span class="stat-positive">${value}</span>`;
                if (losses > wins) return `<span class="stat-negative">${value}</span>`;
                return `<span class="stat-neutral">${value}</span>`;
            }
            
            // Point differentials
            if (key === 'avg_point_differential') {
                const num = parseFloat(value);
                if (num > 0) return `<span class="stat-positive">+${value}</span>`;
                if (num < 0) return `<span class="stat-negative">${value}</span>`;
                return value;
            }
            
            // Ranking (lower is better)
            if (key === 'rank' || key === 'class_rank' || key === 'talent_rank') {
                const num = parseInt(value);
                if (num <= 25) return `<span class="stat-positive">#${value}</span>`;
                if (num <= 50) return `<span class="stat-neutral">#${value}</span>`;
                return `<span class="stat-negative">#${value}</span>`;
            }
            
            // Star counts with icons
            if (key === 'five_stars' && value > 0) {
                return `<span class="stat-positive flex items-center gap-1">
                    <i data-lucide="star" class="w-3 h-3 fill-yellow-400 stroke-yellow-400"></i>
                    <i data-lucide="star" class="w-3 h-3 fill-yellow-400 stroke-yellow-400"></i>
                    <i data-lucide="star" class="w-3 h-3 fill-yellow-400 stroke-yellow-400"></i>
                    <i data-lucide="star" class="w-3 h-3 fill-yellow-400 stroke-yellow-400"></i>
                    <i data-lucide="star" class="w-3 h-3 fill-yellow-400 stroke-yellow-400"></i>
                    <span class="ml-1">${value}</span>
                </span>`;
            }
            if (key === 'four_stars' && value > 0) {
                return `<span class="stat-positive flex items-center gap-1">
                    <i data-lucide="star" class="w-3 h-3 fill-blue-400 stroke-blue-400"></i>
                    <i data-lucide="star" class="w-3 h-3 fill-blue-400 stroke-blue-400"></i>
                    <i data-lucide="star" class="w-3 h-3 fill-blue-400 stroke-blue-400"></i>
                    <i data-lucide="star" class="w-3 h-3 fill-blue-400 stroke-blue-400"></i>
                    <span class="ml-1">${value}</span>
                </span>`;
            }
            if (key === 'three_stars' && value > 0) {
                return `<span class="stat-neutral flex items-center gap-1">
                    <i data-lucide="star" class="w-3 h-3 fill-slate-400 stroke-slate-400"></i>
                    <i data-lucide="star" class="w-3 h-3 fill-slate-400 stroke-slate-400"></i>
                    <i data-lucide="star" class="w-3 h-3 fill-slate-400 stroke-slate-400"></i>
                    <span class="ml-1">${value}</span>
                </span>`;
            }
            
            // Transfer portal net
            if (key === 'net_transfers') {
                const num = parseInt(value);
                if (num > 0) return `<span class="stat-positive">+${value}</span>`;
                if (num < 0) return `<span class="stat-negative">${value}</span>`;
                return `<span class="stat-neutral">${value}</span>`;
            }
            
            // FPI/SP+ ratings
            if ((key === 'fpi' || key.includes('sp_') || key === 'opponent_fpi') && typeof value === 'number') {
                if (value > 10) return `<span class="stat-positive">${value}</span>`;
                if (value < -10) return `<span class="stat-negative">${value}</span>`;
                return value;
            }
            
            return value;
        }
        
        function showTable(tableName) {
            // Update active tab
            document.querySelectorAll('[id^="tab-"]').forEach(tab => {
                tab.className = 'px-4 py-2 rounded-lg text-zinc-400 hover:text-white whitespace-nowrap';
            });
            document.getElementById(`tab-${tableName}`).className = 'px-4 py-2 rounded-lg bg-white/10 text-white font-medium whitespace-nowrap';
            
            // Show table data
            const data = currentData[tableName];
            if (!data || data.length === 0) {
                document.getElementById('table-content').innerHTML = '<div class="text-zinc-400 text-center py-8">No data available</div>';
                return;
            }
            
            const keys = Object.keys(data[0]);
            let html = '<table class="w-full text-left"><thead><tr>';
            
            keys.forEach(key => {
                html += `<th class="px-4 py-3 text-zinc-400 font-medium">${key.replace(/_/g, ' ').toUpperCase()}</th>`;
            });
            
            html += '</tr></thead><tbody>';
            
            data.forEach((row, idx) => {
                const bgClass = idx % 2 === 0 ? 'bg-white/5' : '';
                html += `<tr class="${bgClass}">`;
                keys.forEach(key => {
                    const formattedValue = formatValue(key, row[key], row);
                    html += `<td class="px-4 py-3 text-zinc-200">${formattedValue}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            document.getElementById('table-content').innerHTML = html;
            
            // Initialize Lucide icons
            lucide.createIcons();
        }
        
        // Load data on page load
        loadData();
        
        // Initialize Lucide icons after page load
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
