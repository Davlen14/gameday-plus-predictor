<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBS Teams Index | GAMEDAY+ SYS.V.2.0</title>
    
    <!-- Tailwind & Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#030712',
                        surface: '#111827',
                        primary: '#F43F5E', // Rose 500
                        'primary-dim': 'rgba(244, 63, 94, 0.1)',
                        success: '#10B981',
                        warning: '#F59E0B',
                        'tech-border': 'rgba(255, 255, 255, 0.08)',
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'Menlo', 'monospace'],
                        'display': ['Orbitron', 'sans-serif'],
                    },
                    backgroundImage: {
                        'grid-scan': "linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px)",
                    }
                }
            }
        }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background-color: #030712;
            color: #E5E7EB;
            overflow-x: hidden;
        }

        /* HUD Panels */
        .hud-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid var(--tech-border);
            box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .hud-panel:hover {
            border-color: rgba(244, 63, 94, 0.3);
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.1);
            transform: translateY(-2px);
        }

        /* Scanline Animation for Cards */
        @keyframes scanline {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }

        .scan-overlay {
            position: relative;
            overflow: hidden;
        }

        .scan-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: scanline 3s linear infinite;
            opacity: 0;
            pointer-events: none;
        }
        
        .hud-panel:hover .scan-overlay::after {
            opacity: 1;
        }

        /* Filter Buttons */
        .filter-btn {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9CA3AF;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            color: white;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .filter-btn.active {
            background: rgba(244, 63, 94, 0.1);
            border-color: #F43F5E;
            color: #F43F5E;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.1);
        }

        /* Watermark Logo */
        .watermark-logo {
            position: absolute;
            right: -20px;
            bottom: -20px;
            width: 120px;
            height: 120px;
            opacity: 0.05;
            filter: grayscale(100%);
            transform: rotate(-10deg);
            z-index: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .hud-panel:hover .watermark-logo {
            opacity: 0.1;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #F43F5E; }
    </style>
</head>
<body class="antialiased min-h-screen relative selection:bg-primary selection:text-white">
    
    <!-- Background Grid -->
    <div class="fixed inset-0 bg-grid-scan pointer-events-none z-0 opacity-40"></div>

    <!-- Header -->
    <header class="fixed top-0 w-full z-50 border-b border-white/10 bg-[#030712]/80 backdrop-blur-md">
        <div class="max-w-[1600px] mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-2 h-8 bg-primary shadow-[0_0_15px_rgba(244,63,94,0.5)]"></div>
                <a href="/" class="font-display font-bold text-2xl tracking-wider text-white">
                    GAMEDAY<span class="text-primary">+</span> <span class="text-xs text-gray-500 font-mono align-top mt-1 ml-1 opacity-70">SYS.V.2.0</span>
                </a>
            </div>
            
            <nav class="flex items-center gap-1 bg-surface/50 p-1 rounded-lg border border-white/5">
                <a href="/" class="px-4 py-1.5 text-xs font-mono text-gray-400 hover:text-white transition rounded hover:bg-white/5">DB_HOME</a>
                <a href="/coaches" class="px-4 py-1.5 text-xs font-mono text-gray-400 hover:text-white transition rounded hover:bg-white/5">COACHES</a>
                <a href="/teams" class="px-4 py-1.5 text-xs font-mono text-primary bg-primary/10 rounded font-bold border border-primary/20">TEAMS_Index</a>
            </nav>
        </div>
    </header>

    <main class="relative z-10 pt-24 pb-12 px-4 md:px-8 max-w-[1600px] mx-auto">
        
        <!-- Hero Section -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8">
            <div class="lg:col-span-8 hud-panel rounded-lg p-8 relative overflow-hidden flex flex-col justify-center">
                 <div class="absolute top-0 right-0 p-4 opacity-10">
                    <i data-lucide="server" class="w-32 h-32"></i>
                </div>
                
                <div class="relative z-10">
                    <div class="inline-flex items-center gap-2 px-3 py-1 bg-primary/10 border border-primary/30 rounded mb-4">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
                        </span>
                        <span class="text-[10px] font-mono text-primary uppercase tracking-widest font-bold">Live Database Connection</span>
                    </div>
                    
                    <h1 class="font-display text-4xl md:text-5xl font-bold text-white mb-2 tracking-tight">
                        FBS TEAMS <span class="text-primary">INDEX</span>
                    </h1>
                    <p class="text-gray-400 font-mono text-sm max-w-xl">
                        Full analytical access to 134 Division I programs. Historical data, SP+ ratings, and recruiting composites.
                    </p>
                </div>
            </div>

            <!-- Stats Ticker -->
            <div class="lg:col-span-4 hud-panel rounded-lg p-6 flex flex-col justify-center gap-4">
                <div class="flex items-center justify-between border-b border-white/5 pb-3">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded bg-surface border border-white/10 flex items-center justify-center text-primary">
                            <i data-lucide="users" class="w-4 h-4"></i>
                        </div>
                        <div class="text-xs font-mono text-gray-400 uppercase">Active Programs</div>
                    </div>
                    <div class="text-2xl font-mono font-bold text-white">134</div>
                </div>
                <div class="flex items-center justify-between border-b border-white/5 pb-3">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded bg-surface border border-white/10 flex items-center justify-center text-blue-400">
                            <i data-lucide="database" class="w-4 h-4"></i>
                        </div>
                        <div class="text-xs font-mono text-gray-400 uppercase">Data Points</div>
                    </div>
                    <div class="text-2xl font-mono font-bold text-white">24k+</div>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded bg-surface border border-white/10 flex items-center justify-center text-success">
                            <i data-lucide="history" class="w-4 h-4"></i>
                        </div>
                        <div class="text-xs font-mono text-gray-400 uppercase">Archive Depth</div>
                    </div>
                    <div class="text-2xl font-mono font-bold text-white">25 YRS</div>
                </div>
            </div>
        </div>

        <!-- Controls Bar -->
        <div class="hud-panel rounded-lg p-4 mb-8 sticky top-20 z-40 bg-[#111827]/90 backdrop-blur-xl border-y border-white/10">
            <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
                
                <!-- Filters -->
                <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 no-scrollbar">
                    <i data-lucide="filter" class="w-4 h-4 text-gray-500 mr-2 flex-shrink-0"></i>
                    <button onclick="filterTeams('all')" id="filter-all" class="filter-btn active px-4 py-1.5 rounded text-xs font-mono font-bold uppercase tracking-wider whitespace-nowrap">All</button>
                    <button onclick="filterTeams('SEC')" id="filter-sec" class="filter-btn px-4 py-1.5 rounded text-xs font-mono font-bold uppercase tracking-wider whitespace-nowrap">SEC</button>
                    <button onclick="filterTeams('Big Ten')" id="filter-bigten" class="filter-btn px-4 py-1.5 rounded text-xs font-mono font-bold uppercase tracking-wider whitespace-nowrap">Big Ten</button>
                    <button onclick="filterTeams('Big 12')" id="filter-big12" class="filter-btn px-4 py-1.5 rounded text-xs font-mono font-bold uppercase tracking-wider whitespace-nowrap">Big 12</button>
                    <button onclick="filterTeams('ACC')" id="filter-acc" class="filter-btn px-4 py-1.5 rounded text-xs font-mono font-bold uppercase tracking-wider whitespace-nowrap">ACC</button>
                    <button onclick="filterTeams('Pac-12')" id="filter-pac12" class="filter-btn px-4 py-1.5 rounded text-xs font-mono font-bold uppercase tracking-wider whitespace-nowrap">Pac-12</button>
                    <button onclick="filterTeams('Other')" id="filter-other" class="filter-btn px-4 py-1.5 rounded text-xs font-mono font-bold uppercase tracking-wider whitespace-nowrap">G5 / Ind</button>
                </div>

                <div class="flex items-center gap-3 w-full md:w-auto">
                    <!-- Search -->
                    <div class="relative w-full md:w-64">
                        <input 
                            type="text" 
                            id="searchInput"
                            placeholder="SEARCH_TEAMS..."
                            class="w-full bg-black/40 border border-white/10 rounded px-4 py-2 pl-10 text-xs font-mono text-white placeholder-gray-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all uppercase"
                        >
                        <i data-lucide="search" class="absolute left-3 top-2 w-4 h-4 text-gray-600"></i>
                    </div>
                    
                    <!-- Sort Button -->
                     <button id="sortBtn" class="bg-surface border border-white/10 hover:border-primary/50 text-gray-400 hover:text-white rounded px-3 py-2 transition flex items-center justify-center">
                        <i data-lucide="arrow-up-down" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Teams Grid -->
        <div id="teamsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Loading State -->
            <div class="col-span-full py-20 text-center">
                <div class="inline-flex items-center gap-3 text-primary font-mono animate-pulse">
                    <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
                    <span class="tracking-widest">RETRIEVING DATABASE RECORDS...</span>
                </div>
            </div>
        </div>

    </main>

    <script>
        lucide.createIcons();

        let allTeams = [];
        let currentFilter = 'all';

        // Conference styling map
        const confStyles = {
            'SEC': { color: '#F59E0B', text: 'text-amber-500', bg: 'bg-amber-500/10', border: 'border-amber-500/20' },
            'Big Ten': { color: '#3B82F6', text: 'text-blue-500', bg: 'bg-blue-500/10', border: 'border-blue-500/20' },
            'Big 12': { color: '#E5E7EB', text: 'text-gray-200', bg: 'bg-gray-500/10', border: 'border-gray-500/20' },
            'ACC': { color: '#A855F7', text: 'text-purple-500', bg: 'bg-purple-500/10', border: 'border-purple-500/20' },
            'Pac-12': { color: '#10B981', text: 'text-emerald-500', bg: 'bg-emerald-500/10', border: 'border-emerald-500/20' },
            'default': { color: '#6B7280', text: 'text-gray-500', bg: 'bg-gray-500/10', border: 'border-gray-500/20' }
        };

        async function loadTeams() {
            try {
                const response = await fetch('/api/teams');
                const data = await response.json();
                allTeams = data.teams || [];
                renderTeams(allTeams);
            } catch (error) {
                console.error('Error loading teams:', error);
                document.getElementById('teamsGrid').innerHTML = `
                    <div class="col-span-full hud-panel rounded-lg p-10 text-center border border-red-500/30">
                        <i data-lucide="alert-triangle" class="w-12 h-12 text-red-500 mx-auto mb-4"></i>
                        <p class="text-red-500 font-display font-bold text-lg mb-2">SYSTEM ERROR: DATABASE OFFLINE</p>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        function getConfStyle(confName) {
            if (!confName) return confStyles['default'];
            const name = confName;
            if (name.includes('SEC')) return confStyles['SEC'];
            if (name.includes('Big Ten') || name.includes('Big 10')) return confStyles['Big Ten'];
            if (name.includes('Big 12')) return confStyles['Big 12'];
            if (name.includes('ACC')) return confStyles['ACC'];
            if (name.includes('Pac')) return confStyles['Pac-12'];
            return confStyles['default'];
        }

        function renderTeams(teams) {
            const grid = document.getElementById('teamsGrid');
            
            if (teams.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <p class="text-gray-500 font-mono">NO RECORDS FOUND</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = teams.map(team => {
                const conf = team.conference || 'N/A';
                const style = getConfStyle(conf);
                const logoUrl = team.logo_url || `https://a.espncdn.com/i/teamlogos/ncaa/500/${team.espn_id || team.id}.png`;
                
                return `
                    <a href="/team/${team.id}" class="hud-panel rounded-lg p-5 block group scan-overlay relative overflow-hidden" 
                       style="border-left: 3px solid ${style.color}">
                        
                        <!-- Watermark -->
                        <img src="${logoUrl}" alt="" class="watermark-logo">
                        
                        <!-- Header -->
                        <div class="relative z-10 flex items-start gap-4 mb-4">
                            <div class="w-12 h-12 rounded bg-black/40 border border-white/5 p-1 flex items-center justify-center flex-shrink-0">
                                <img src="${logoUrl}" alt="${team.school}" class="w-full h-full object-contain" 
                                     onerror="this.src='https://via.placeholder.com/48?text=TM'">
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="font-display font-bold text-white text-base truncate group-hover:text-primary transition-colors">
                                    ${team.school}
                                </h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="px-1.5 py-0.5 rounded text-[10px] font-mono font-bold border ${style.bg} ${style.text} ${style.border}">
                                        ${conf}
                                    </span>
                                    ${team.division ? `<span class="text-[10px] font-mono text-gray-500 border border-white/5 px-1.5 py-0.5 rounded">${team.division}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        
                        <!-- Stats Grid -->
                        <div class="relative z-10 grid grid-cols-2 gap-3 pt-3 border-t border-white/5">
                            <div>
                                <div class="text-[9px] text-gray-500 font-mono uppercase tracking-wider mb-0.5">Seasons</div>
                                <div class="text-sm font-mono font-bold text-white">${team.total_seasons || 0}</div>
                            </div>
                            <div>
                                <div class="text-[9px] text-gray-500 font-mono uppercase tracking-wider mb-0.5">Rankings</div>
                                <div class="text-sm font-mono font-bold text-gray-300">${team.total_rankings || 0} <span class="text-[9px] text-gray-600">WKS</span></div>
                            </div>
                            <div class="col-span-2">
                                <div class="text-[9px] text-gray-500 font-mono uppercase tracking-wider mb-0.5">Base of Ops</div>
                                <div class="text-xs font-mono text-gray-400 truncate flex items-center gap-1">
                                    <i data-lucide="map-pin" class="w-3 h-3"></i>
                                    ${team.location_name ? team.location_name : (team.city ? `${team.city}, ${team.state}` : 'Unknown')}
                                </div>
                            </div>
                        </div>

                        <!-- Hover Arrow -->
                        <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <i data-lucide="arrow-up-right" class="w-4 h-4 text-primary"></i>
                        </div>
                    </a>
                `;
            }).join('');

            lucide.createIcons();
        }

        function filterTeams(filter) {
            currentFilter = filter;
            
            // Buttons UI
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const btnId = `filter-${filter.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
            const activeBtn = document.getElementById(btnId);
            if(activeBtn) activeBtn.classList.add('active');
            
            // Logic
            applyFilters();
        }

        // Search Input
        document.getElementById('searchInput').addEventListener('input', applyFilters);

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = allTeams.filter(team => {
                // Filter by Conference
                const confMatch = currentFilter === 'all' || 
                    (currentFilter === 'Other' 
                        ? !['SEC', 'Big Ten', 'Big 12', 'ACC', 'Pac-12'].some(c => team.conference?.includes(c))
                        : team.conference?.includes(currentFilter)
                    );

                // Filter by Search
                const searchMatch = !searchTerm || 
                    team.school.toLowerCase().includes(searchTerm) ||
                    (team.mascot && team.mascot.toLowerCase().includes(searchTerm));

                return confMatch && searchMatch;
            });

            renderTeams(filtered);
        }

        // Sort functionality
        let sortAscending = true;
        document.getElementById('sortBtn').addEventListener('click', () => {
            sortAscending = !sortAscending;
            const btn = document.getElementById('sortBtn');
            btn.innerHTML = sortAscending ? '<i data-lucide="arrow-down-az" class="w-4 h-4"></i>' : '<i data-lucide="arrow-up-za" class="w-4 h-4"></i>';
            lucide.createIcons();
            
            allTeams.sort((a, b) => {
                return sortAscending 
                    ? a.school.localeCompare(b.school)
                    : b.school.localeCompare(a.school);
            });
            applyFilters(); // Re-render with current filters
        });

        // Init
        loadTeams();
    </script>
</body>
</html>
