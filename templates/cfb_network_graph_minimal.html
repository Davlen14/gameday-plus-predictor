        function hexToRgb(hex) {
            var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? 
                parseInt(result[1], 16) + ',' + parseInt(result[2], 16) + ',' + parseInt(result[3], 16)
                : '255,255,255';
        }

        function switchView(view) {
            currentView = view;
            buildChart();
        }

        function getDataForView(view) {
            var data = [];
            var rootNode = 'FBS Football 2025';
            
            if (view === 'conference') {
                var conferences = ['SEC', 'Big Ten', 'ACC', 'Big 12', 'American Athletic', 'Conference USA', 'Mid-American', 'Mountain West', 'Sun Belt'];
                conferences.forEach(function(conf) {
                    data.push([rootNode, conf]);
                });
                
                Object.keys(teamData).forEach(function(team) {
                    data.push([teamData[team].conf, team, teamData[team].perf]);
                });
                
            } else if (view === 'performance') {
                Object.keys(teamData).forEach(function(team) {
                    var perf = teamData[team].perf;
                    if (perf >= 3.2) {
                        data.push(['Elite Tier (3.2+)', team, perf]);
                    } else if (perf >= 3.0) {
                        data.push(['Strong Tier (3.0-3.19)', team, perf]);
                    } else if (perf >= 2.8) {
                        data.push(['Average Tier (2.8-2.99)', team, perf]);
                    } else {
                        data.push(['Developing Tier (<2.8)', team, perf]);
                    }
                });
                
                data.unshift([rootNode, 'Elite Tier (3.2+)']);
                data.unshift([rootNode, 'Strong Tier (3.0-3.19)']);
                data.unshift([rootNode, 'Average Tier (2.8-2.99)']);
                data.unshift([rootNode, 'Developing Tier (<2.8)']);
                
            } else if (view === 'offense') {
                data.push([rootNode, 'Elite Offense (4.5+)']);
                data.push([rootNode, 'Strong Offense (4.0-4.49)']);
                data.push([rootNode, 'Average Offense (3.5-3.99)']);
                data.push([rootNode, 'Developing Offense (<3.5)']);
                
                Object.keys(teamData).forEach(function(team) {
                    var off = teamData[team].offense;
                    if (off >= 4.5) {
                        data.push(['Elite Offense (4.5+)', team, teamData[team].perf]);
                    } else if (off >= 4.0) {
                        data.push(['Strong Offense (4.0-4.49)', team, teamData[team].perf]);
                    } else if (off >= 3.5) {
                        data.push(['Average Offense (3.5-3.99)', team, teamData[team].perf]);
                    } else {
                        data.push(['Developing Offense (<3.5)', team, teamData[team].perf]);
                    }
                });
                
            } else if (view === 'defense') {
                data.push([rootNode, 'Elite Defense (4.5+)']);
                data.push([rootNode, 'Strong Defense (4.0-4.49)']);
                data.push([rootNode, 'Average Defense (3.5-3.99)']);
                data.push([rootNode, 'Developing Defense (<3.5)']);
                
                Object.keys(teamData).forEach(function(team) {
                    var def = teamData[team].defense;
                    if (def >= 4.5) {
                        data.push(['Elite Defense (4.5+)', team, teamData[team].perf]);
                    } else if (def >= 4.0) {
                        data.push(['Strong Defense (4.0-4.49)', team, teamData[team].perf]);
                    } else if (def >= 3.5) {
                        data.push(['Average Defense (3.5-3.99)', team, teamData[team].perf]);
                    } else {
                        data.push(['Developing Defense (<3.5)', team, teamData[team].perf]);
                    }
                });
                
            } else if (view === 'style') {
                data.push([rootNode, 'Explosive Style']);
                data.push([rootNode, 'Balanced Style']);
                data.push([rootNode, 'Defensive Style']);
                
                Object.keys(teamData).forEach(function(team) {
                    var style = teamData[team].style;
                    if (style === 'explosive') {
                        data.push(['Explosive Style', team, teamData[team].perf]);
                    } else if (style === 'balanced') {
                        data.push(['Balanced Style', team, teamData[team].perf]);
                    } else {
                        data.push(['Defensive Style', team, teamData[team].perf]);
                    }
                });
            }
            
            return data;
        }

                            var parentColor = nodes[link[0]].marker.lineColor || nodes[link[0]].color;
                            
                            nodes[link[1]] = {
                                id: link[1],
                                color: logoUrl ? 'rgba(255, 255, 255, 0.15)' : nodes[link[0]].color,
                                marker: {
                                    symbol: logoUrl ? 'url(' + logoUrl + ')' : 'circle',
                                    width: radius * 2.2,
                                    height: radius * 2.2,
                                    radius: radius,
                                    lineWidth: 2,
                                    lineColor: parentColor
                                }
                            };
                        }
                    });

                    e.options.nodes = Object.keys(nodes).map(function (id) {
                        return nodes[id];
                    });
                }
            }
        );

        function buildChart() {
            var chartData = getDataForView(currentView);
            
            chart = Highcharts.chart('container', {
                chart: {
                    type: 'networkgraph',
                    height: '100%',
                    backgroundColor: 'transparent',
                    zooming: {
                        type: 'xy'
                    },
                    panning: {
                        enabled: true,
                        type: 'xy'
                    },
                    panKey: 'shift',
                    events: {
                        load: function() {
                            var chart = this;
                            setTimeout(function() {
                                if (chart.series[0] && chart.series[0].points) {
                                    chart.setSize(chart.chartWidth, chart.chartHeight, false);
                                }
                            }, 100);
                        }
                    }
                },
                title: {
                    text: '',
                    style: {
                        color: '#fff'
                    }
                },
                subtitle: {
                    text: '',
                    style: {
                        color: '#9aa0a6'
                    }
                },
                plotOptions: {
                    networkgraph: {
                        keys: ['from', 'to', 'performance'],
                        draggable: true,
                        layoutAlgorithm: {
                            enableSimulation: true,
                            friction: -0.9,
                            linkLength: 100,
                            gravitationalConstant: 0.015,
                            maxSpeed: 10,
                            integration: 'verlet',
                            approximation: 'barnes-hut',
                            initialPositions: 'circle'
                        },
                        link: {
                            color: 'rgba(255, 255, 255, 0.2)',
                            width: 1.5
                        },
                        states: {
                            hover: {
                                halo: {
                                    size: 15,
                                    opacity: 0.5
                                },
                                brightness: 0.3
                            },
                            inactive: {
                                opacity: 0.3
                            }
                        }
                    }
                },
                series: [{
                    accessibility: {
                        enabled: false
                    },
                    dataLabels: {
                        enabled: true,
                        linkFormat: '',
                        style: {
                            fontSize: '0.75em',
                            fontWeight: 'normal',
                            color: '#e8eaed',
                            textOutline: '2px #0f1419'
                        }
                    },
                    id: 'cfb-tree',
                    data: chartData
                }],
                tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.85)',
                    borderColor: '#666',
                    style: {
                        color: '#fff'
                    },
                    formatter: function() {
                        if (this.point.id === 'FBS Football 2025') {
                            return '<b>FBS Football 2025</b><br/>All conferences and teams';
                        } else if (this.point.linksFrom && this.point.linksFrom.length > 5) {
                            return '<b>' + this.point.id + '</b><br/>' + 
                                   this.point.linksFrom.length + ' teams';
                        } else {
                            var team = teamData[this.point.id];
                            if (team) {
                                return '<b>' + this.point.id + '</b><br/>' + 
                                       'Conference: <b>' + team.conf + '</b><br/>' +
                                       'Performance: <b>' + team.perf.toFixed(2) + '</b><br/>' + 
                                       'Offense Rating: <b>' + team.offense.toFixed(2) + '</b><br/>' + 
                                       'Defense Rating: <b>' + team.defense.toFixed(2) + '</b><br/>' + 
                                       'Style: <b>' + team.style.charAt(0).toUpperCase() + team.style.slice(1) + '</b>';
                            }
                            return '<b>' + this.point.id + '</b>';
                        }
                    }
                }
            });
        }

        // Listen for messages from parent window to change views
        window.addEventListener('message', function(event) {
            if (event.data && event.data.action === 'switchView') {
                switchView(event.data.view);
            }
        });
        
        buildChart();
    </script>
</body>
</html>
