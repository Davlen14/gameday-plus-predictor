            border-spacing: 0;

        function setTeamBackground(teamData) {
            if (!teamData || !teamData.primary) return;
            
            const primary = teamData.primary;
            const alt = teamData.alt || teamData.primary;
            
            console.log('Setting team background for:', teamData.name, 'Primary:', primary, 'Alt:', alt);
            
            // Create much darker versions of team colors for true dark mode
            const darkPrimary = adjustBrightness(primary, -85);
            const darkAlt = adjustBrightness(alt, -85);
            const mediumPrimary = adjustBrightness(primary, -70);
            const mediumAlt = adjustBrightness(alt, -70);
            const lightPrimary = adjustBrightness(primary, -55);
            const lightAlt = adjustBrightness(alt, -55);
            
            console.log('Calculated colors - Dark Primary:', darkPrimary, 'Dark Alt:', darkAlt);
            
            // Create a more complex gradient that ensures both colors are visible
            const gradient = `linear-gradient(135deg, ${darkPrimary} 0%, ${darkAlt} 20%, ${mediumPrimary} 40%, ${mediumAlt} 60%, ${lightPrimary} 80%, ${darkAlt} 100%)`;
            
            // Update CSS custom properties for dark mode
            document.documentElement.style.setProperty('--dark-bg-color', gradient);
            
            // Update color overlays with both team colors prominently
            const primaryRgba = hexToRgba(primary, 0.20);
            const altRgba = hexToRgba(alt, 0.18);
            const primaryDarkRgba = hexToRgba(mediumPrimary, 0.15);
            const altDarkRgba = hexToRgba(mediumAlt, 0.12);
            
            const overlay = `radial-gradient(circle at 15% 15%, ${primaryRgba} 0%, transparent 45%), radial-gradient(circle at 85% 85%, ${altRgba} 0%, transparent 45%), radial-gradient(circle at 50% 20%, ${primaryDarkRgba} 0%, transparent 40%), radial-gradient(circle at 20% 80%, ${altDarkRgba} 0%, transparent 40%)`;
            
            document.documentElement.style.setProperty('--dark-overlay', overlay);
            
            console.log('Applied gradient:', gradient);
            console.log('Applied overlay:', overlay);
        }
        
        // Helper functions
        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        
        function adjustBrightness(hex, percent) {
            const num = parseInt(hex.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            let R = (num >> 16) + amt;
            let G = (num >> 8 & 0x00FF) + amt;
            let B = (num & 0x0000FF) + amt;
            
            // Ensure colors don't go completely black (minimum brightness of 15)
            R = Math.max(15, Math.min(255, R));
            G = Math.max(15, Math.min(255, G));
            B = Math.max(15, Math.min(255, B));
            
            return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        function getGradientStyle(team) {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const isDarkAlt = team.alt === "#000000" || team.alt === "#492000" || team.alt === "#222222";
            const secondary = isDarkAlt ? adjustBrightness(team.primary, -30) : team.alt;
            const angle = 45; 
            
            if (isDark) {
                // Use much darker versions of BOTH team colors, never pure black
                const darkPrimary = adjustBrightness(team.primary, -80);
                const darkSecondary = adjustBrightness(secondary, -80);
                return `linear-gradient(${angle}deg, ${darkPrimary} 0%, ${darkSecondary} 80%)`;
            }
            
            const stop1 = 10;
            return `linear-gradient(${angle}deg, ${team.primary} 0%, ${team.primary} ${stop1}%, ${secondary} 100%)`;
        }

        function getGlowStyle(team) {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const color = (team.alt === '#000000' || team.alt === '#222222') ? '#ffffff' : team.alt;
            
            if (isDark) {
                return { color: team.primary, top: 20, left: 20, opacity: 0.3 };
            }
            return { color, top: 20, left: 20, opacity: 0.6 };
        }

        function updateBackground(teamName) {
            const team = TEAMS.find(t => t.name === teamName) || TEAMS[0];
            
            const bg = document.getElementById('dynamic-bg');
            const glow = document.getElementById('glow-orb');
            const secondaryGlow = document.getElementById('secondary-orb');

            if(bg) {
                // In dark mode, let setTeamBackground handle the main gradient
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (!isDark) {
                    bg.style.background = getGradientStyle(team);
                }
            }
            
            if(glow) {
                const glowStyle = getGlowStyle(team);
                glow.style.backgroundColor = glowStyle.color;
                glow.style.boxShadow = `0 0 150px 80px ${glowStyle.color}`;
                glow.style.opacity = glowStyle.opacity;
            }
            
            if(secondaryGlow) {
                secondaryGlow.style.backgroundColor = team.primary;
                secondaryGlow.style.opacity = document.documentElement.getAttribute('data-theme') === 'dark' ? '0.2' : '0.4';
            }
            
            const accentLine = document.getElementById('teamAccentLine');
            if(accentLine) accentLine.style.backgroundColor = team.primary;

                if (v >= 75) return 'val-elite';
                if (v >= 60) return 'val-good';
                if (v >= 50) return 'val-avg';
                return 'val-bad';
            }
            if (type === 'fpi' || type === 'sp') {
                if (v >= 15) return 'val-elite';
                if (v >= 5) return 'val-good';
                if (v >= 0) return 'val-avg';
                return 'val-bad';
            }
            if (type === 'rank') {
                if (v <= 10) return 'val-elite';
                if (v <= 25) return 'val-good';
                if (v <= 50) return 'val-avg';
                return 'val-poor';

        async function loadCoachData() {
            try {
                const res = await fetch(`/api/coach/${coachId}`);
                const data = await res.json();
                
                // UI Header Update
                document.getElementById('coach-name').textContent = data.name;
                document.getElementById('current-school').textContent = data.current_school;
                document.getElementById('career-record').textContent = data.career_record;
                document.getElementById('win-pct').innerHTML = `<span class="${getValClass(data.career_win_pct * 100, 'win_pct')}">${(data.career_win_pct * 100).toFixed(1)}%</span>`;
                document.getElementById('total-games').textContent = data.total_games;

                // Handle Team Logo (Mirrored)
                const team = TEAMS.find(t => t.name === data.current_school);
                const logoUrl = team ? team.logo : "https://a.espncdn.com/i/teamlogos/ncaa/500/500.png";
                
                const logoImg = document.getElementById('team-logo');
                const logoReflect = document.getElementById('team-logo-reflect');
                
                if(logoImg) logoImg.src = logoUrl;
                if(logoReflect) logoReflect.src = logoUrl;

                // Handle Coach Headshot
                const headshotImg = document.getElementById('coach-headshot');
                if(headshotImg) {
                    if (data.headshot_url) {
                        headshotImg.src = data.headshot_url;
                        headshotImg.onload = () => {
                            headshotImg.classList.remove('opacity-0');
                        };
                    } else {
                        headshotImg.style.display = 'none';
                    }
                }

                // Global reference for charts
                window.currentCoach = {
                    ...data,
                    school_logo: logoUrl
                };

                // Dynamic Styling based on School Color
                updateBackground(data.current_school);
                
                // Set team-based background colors for dark mode
                if (team) {
                    setTeamBackground(team);
                }

                // Load additional data for status panel
                loadStatusData();

                // Initial Tab
                renderTabs();
                showTab('timeline');

            } catch (e) {
                console.error("Critical System Failure:", e);
            }
        }

        async function loadStatusData() {
            try {
                // Fetch stints data for years calculation
                const stintsRes = await fetch(`/api/coach/${coachId}/stints`);
                const stintsData = await stintsRes.json();
                if (stintsData.stints && stintsData.stints.length > 0) {
                    const years = stintsData.stints.reduce((acc, s) => acc + (s.end_year - s.start_year + 1), 0);
                    document.getElementById('years-coached').textContent = years;
                }

                // Fetch season analytics for SP+ tier
                const analyticsRes = await fetch(`/api/coach/${coachId}/season_analytics`);
                const analyticsData = await analyticsRes.json();
                if (analyticsData.season_analytics && analyticsData.season_analytics.length > 0) {
                    const latest = analyticsData.season_analytics[0];
                    const spPlus = latest.sp_overall;
                    if (spPlus) {
                        let tier = 'N/A';
                        if (spPlus >= 20) tier = 'ELITE (Top 5)';
                        else if (spPlus >= 15) tier = 'TIER 1 (Top 15)';
                        else if (spPlus >= 10) tier = 'TIER 2 (Top 25)';
                        else if (spPlus >= 5) tier = 'TIER 3 (Top 40)';
                        else if (spPlus >= 0) tier = 'TIER 4 (50+)';
                        else tier = 'BELOW AVG';
                        document.getElementById('stat-sp-tier').textContent = tier;
                    }
                }

                // Fetch recruiting for trajectory
                const recruitingRes = await fetch(`/api/coach/${coachId}/recruiting_classes`);
                const recruitingData = await recruitingRes.json();
                if (recruitingData.recruiting_classes && recruitingData.recruiting_classes.length >= 2) {
                    const classes = recruitingData.recruiting_classes.slice(0, 3);
                    const latest = classes[0].class_rank;
                    const prev = classes[1].class_rank;
                    let trajectory = '';
                    if (latest < prev) trajectory = `<i data-lucide="trending-up" class="w-4 h-4 inline text-emerald-400"></i> RISING (#${latest})`;
                    else if (latest > prev) trajectory = `<i data-lucide="trending-down" class="w-4 h-4 inline text-red-400"></i> DECLINING (#${latest})`;
                    else trajectory = `<i data-lucide="minus" class="w-4 h-4 inline text-gray-400"></i> STEADY (#${latest})`;
                    document.getElementById('stat-rec-traj').innerHTML = trajectory;
                    lucide.createIcons();
                } else if (recruitingData.recruiting_classes && recruitingData.recruiting_classes.length > 0) {
                    document.getElementById('stat-rec-traj').textContent = `#${recruitingData.recruiting_classes[0].class_rank}`;
                }

                // Fetch timeline for active streak
                const timelineRes = await fetch(`/api/coach/${coachId}/timeline`);
                const timelineData = await timelineRes.json();
                if (timelineData.weekly && timelineData.weekly.length > 0) {
                    const latestWeek = timelineData.weekly[timelineData.weekly.length - 1];
                    const streak = latestWeek.win_streak || 0;
                    if (streak > 0) {
                        document.getElementById('stat-streak').innerHTML = `<i data-lucide="flame" class="w-4 h-4 inline text-orange-500"></i> <span class="text-emerald-400">${streak}W</span>`;
                        lucide.createIcons();
                    } else {
                        document.getElementById('stat-streak').innerHTML = `<span class="text-red-400">0W</span>`;
                    }
                }

            } catch (e) {
                console.error("Status data load error:", e);
            }
        }

        function drawWatermarks(chart) {
            // Add coach headshot overlay (top-right) - more subtle
            if (currentCoach && currentCoach.image_url) {
                chart.renderer.image(
                    currentCoach.image_url,
                    chart.plotWidth - 120,
                    10,
                    100,
                    100
                ).attr({
                    opacity: 0.08,
                    zIndex: 1
                }).add();
            }
            
            // Add school logo watermark (center) - very subtle
            if (currentCoach && currentCoach.school_logo) {
                chart.renderer.image(
                    currentCoach.school_logo,
                    chart.plotWidth / 2 - 75,
                    chart.plotHeight / 2 - 75,
                    150,
                    150
                ).attr({
                    opacity: 0.02,
                    zIndex: 1
                }).add();
            }
            
            // Add career stats watermark (top-left) - more subtle
            if (currentCoach) {
                let wins = currentCoach.wins || 0;
                let losses = currentCoach.losses || 0;
                
                // If wins/losses are 0, don't show the watermark
                if (wins === 0 && losses === 0) return;
                
                const winPct = wins + losses > 0 ? ((wins / (wins + losses)) * 100).toFixed(1) : '0.0';
                
                chart.renderer.text(
                    `${wins}-${losses} (${winPct}%)`,
                    20,
                    40
                ).attr({
                    zIndex: 3
                }).css({

                document.getElementById('years-coached').textContent = years;
            }

            const html = `<table class="analytics-table">

                        <th>Win %</th>

                        // Parse record string like "82-11" or "82-11-0"

                <thead>
                    <tr>
                        <th>School</th>
                        <th>Home</th>
                        <th>Away</th>
                        <th>Conf</th>
                        <th>1-Score</th>
                        <th>vs Ranked</th>
                        <th>vs Top 10</th>
                        <th>Bowl</th>
                    </tr>
                </thead>
                <tbody>
                    ${stats.map(s => `<tr>
                        <td class="font-bold text-white">${s.school}</td>
                        <td class="text-emerald-300 font-mono">${s.home_record}</td>
                        <td class="text-yellow-300 font-mono">${s.away_record}</td>
                        <td class="text-white/80 font-mono">${s.conference_record}</td>
                        <td class="font-mono">${s.one_score_wins}-${s.one_score_losses}</td>
                        <td class="text-orange-300 font-mono">${s.vs_ranked_record}</td>
                        <td class="text-red-400 font-mono">${s.vs_top_10_record}</td>
                        <td class="text-blue-300 font-mono">${s.bowl_record}</td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
            document.getElementById('content-area').innerHTML = renderTableWrapper('SITUATIONAL RECORDS', 'Split Performance Analysis', html);
        }

        function renderVsCoaches(data) {
            const vs = data.vs_coaches || [];
            const html = `<table class="analytics-table">
                <thead>
                    <tr>
                        <th>Opponent</th>
                        <th>Program</th>
                        <th>Record</th>
                        <th>Diff</th>
                        <th>Last Met</th>
                    </tr>
                </thead>
                <tbody>
                    ${vs.map(v => {
                        const diff = v.avg_point_differential;
                        const diffClass = diff > 0 ? 'text-emerald-400' : 'text-red-400';
                        return `<tr>
                        <td class="font-bold text-white">${v.opponent_coach}</td>
                        <td class="text-white/70">${v.opponent_school}</td>
                        <td class="font-mono text-white bg-white/5 px-2 py-1 rounded w-max ml-auto">${v.record}</td>
                        <td class="${diffClass} font-mono">${diff > 0 ? '+' : ''}${formatNum(diff)}</td>
                        <td class="text-white/60 font-mono text-xs">${v.last_meeting_year}</td>
                    </tr>`}).join('')}
                </tbody>
            </table>`;
            document.getElementById('content-area').innerHTML = renderTableWrapper('HEAD-TO-HEAD', 'Coach Matchup Database', html);
        }

        function renderRankings(data) {
            const ranks = (data.rankings || []).slice(0, 100);
            const html = `<table class="analytics-table">
                <thead>
                    <tr>
                        <th>Year</th>
                        <th>Week</th>
                        <th>Program</th>
                        <th>AP Rank</th>
                    </tr>
                </thead>
                <tbody>
                    ${ranks.map(r => `<tr>
                        <td class="font-mono text-white/70">${r.season}</td>
                        <td class="font-mono text-xs">WK ${r.week}</td>
                        <td class="text-white">${r.school}</td>
                        <td class="font-bold text-lg ${getValClass(r.rank, 'rank')}">#${r.rank}</td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
            document.getElementById('content-area').innerHTML = renderTableWrapper('AP POLL HISTORY', 'Ranked Appearances', html);
        }

        function renderRecruiting(data) {
            const recs = (data.recruiting_classes || []).slice(0, 20);
            const html = `<table class="analytics-table">
                <thead>
                    <tr>
                        <th>Class</th>
                        <th>School</th>
                        <th>Nat Rank</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody>
                    ${recs.map(r => `<tr>
                        <td class="font-bold text-white">${r.year}</td>
                        <td class="text-white/80">${r.school}</td>
                        <td class="font-bold text-xl ${getValClass(r.class_rank, 'rank')}">#${r.class_rank}</td>
                        <td class="font-mono text-white/70">${formatNum(r.total_rating)}</td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
            document.getElementById('content-area').innerHTML = renderTableWrapper('RECRUITING DATABASE', 'Class Rankings', html);
        }

        function renderTalent(data) {
            const tal = data.talent_composite || [];
            const html = `<table class="analytics-table">
                <thead>
                    <tr>
                        <th>Season</th>
                        <th>School</th>
                        <th>Talent Score</th>
                        <th>Roster Rank</th>
                    </tr>
                </thead>
                <tbody>
                    ${tal.map(t => `<tr>
                        <td class="font-bold text-white">${t.year}</td>
                        <td class="text-white/80">${t.school}</td>
                        <td class="font-mono text-blue-300">${formatNum(t.talent_rating)}</td>
                        <td class="font-bold text-lg ${getValClass(t.national_rank, 'rank')}">#${t.national_rank}</td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
            document.getElementById('content-area').innerHTML = renderTableWrapper('ROSTER TALENT', '247Sports Team Talent Composite', html);
        }

        function renderPortal(data) {
            const rows = data.transfer_portal || [];
            const html = `<table class="analytics-table">
                <thead>
                    <tr>
                        <th>Season</th>
                        <th>School</th>
                        <th>In</th>
                        <th>Out</th>
                        <th>Net</th>
                        <th>Rating In</th>
                    </tr>
                </thead>
                <tbody>
                    ${rows.map(p => {
                        const netClass = p.net_transfers > 0 ? 'text-emerald-400' : p.net_transfers < 0 ? 'text-red-400' : 'text-white/60';
                        return `<tr>
                        <td class="text-white">${p.season}</td>
                        <td class="text-white/70">${p.school}</td>
                        <td class="text-emerald-300 font-mono">${p.transfers_in}</td>
                        <td class="text-red-300 font-mono">${p.transfers_out}</td>
                        <td class="${netClass} font-bold font-mono">${p.net_transfers > 0 ? '+' : ''}${p.net_transfers}</td>
                        <td class="text-blue-300 font-mono">${formatNum(p.avg_rating_in, 2)}</td>
                    </tr>`}).join('')}
                </tbody>
            </table>`;
            document.getElementById('content-area').innerHTML = renderTableWrapper('TRANSFER PORTAL', 'Roster Turnover', html);
        }

        function renderDraft(data) {
            const picks = (data.draft_picks || []).slice(0, 50);
            const html = `<table class="analytics-table">
                <thead>
                    <tr>
                        <th>Year</th>
                        <th>Player</th>
                        <th>Pos</th>
                        <th>Rd / Pick</th>
                        <th>NFL Team</th>
                    </tr>
                </thead>
                <tbody>
                    ${picks.map(p => `<tr>
                        <td class="font-mono text-white/60">${p.year}</td>
                        <td class="font-bold text-white">${p.player_name}</td>
                        <td class="text-xs font-mono bg-white/5 px-1 rounded text-center">${p.position}</td>
                        <td class="font-mono text-yellow-500">R${p.round} / P${p.pick}</td>
                        <td class="text-white/70 text-xs uppercase">${p.nfl_team}</td>
                    </tr>`).join('')}
                </tbody>
            </table>`;
            document.getElementById('content-area').innerHTML = renderTableWrapper('NFL PRODUCTION', 'Draft Output', html);
        }

        // Init
        loadCoachData();
    </script>
</body>
</html>
