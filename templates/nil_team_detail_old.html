<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team NIL Detail - Gameday+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #050505 0%, #0a0a0a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Back Button */
        .back-btn {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 20px;
            color: #fff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(0, 255, 135, 0.1);
            border-color: #00ff87;
        }

        /* Team Header */
        .team-header {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .team-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00ff87, #60efff);
        }

        .team-name {
            font-size: 3em;
            font-weight: 800;
            background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .team-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-box {
            background: rgba(0, 255, 135, 0.1);
            border: 1px solid rgba(0, 255, 135, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-box.primary {
            background: linear-gradient(135deg, rgba(0, 255, 135, 0.2), rgba(96, 239, 255, 0.2));
            border: 1px solid rgba(0, 255, 135, 0.5);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: 700;
            color: #00ff87;
            margin-bottom: 5px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95em;
        }

        /* Position Breakdown */
        .section {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-title {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .position-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .position-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .position-card:hover {
            background: rgba(0, 255, 135, 0.05);
            border-color: rgba(0, 255, 135, 0.3);
            transform: translateY(-2px);
        }

        .position-name {
            font-size: 1.3em;
            font-weight: 700;
            color: #60efff;
            margin-bottom: 15px;
        }

        .position-stats {
            display: grid;
            gap: 10px;
        }

        .position-stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .position-stat-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
        }

        .position-stat-value {
            font-weight: 600;
            color: #00ff87;
        }

        /* Players Table */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(0, 255, 135, 0.1);
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #00ff87;
            border-bottom: 2px solid rgba(0, 255, 135, 0.3);
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(0, 255, 135, 0.05);
        }

        .player-name {
            font-weight: 600;
            color: #fff;
        }

        .position-badge {
            display: inline-block;
            background: rgba(96, 239, 255, 0.2);
            border: 1px solid rgba(96, 239, 255, 0.4);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.85em;
            font-weight: 600;
            color: #60efff;
        }

        .valuation-badge {
            font-weight: 700;
            color: #00ff87;
            font-size: 1.1em;
        }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #00ff87, #60efff);
            color: #050505;
            font-weight: 700;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 0.9em;
        }

        .efficiency-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .efficiency-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff87, #60efff);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .filter-bar {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-bar select,
        .filter-bar input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            outline: none;
        }

        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: #00ff87;
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.5);
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00ff87;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .team-name {
                font-size: 2em;
            }

            .team-stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .position-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.9em;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/nil" class="back-btn">← Back to All Teams</a>

        <div class="team-header" id="teamHeader">
            <div class="loading">
                <div class="spinner"></div>
                Loading team data...
            </div>
        </div>

        <div class="section" id="positionBreakdown" style="display: none;">
            <h2 class="section-title">📊 Position Group Analysis</h2>
            <div class="position-grid" id="positionGrid"></div>
        </div>

        <div class="section" id="playersSection" style="display: none;">
            <h2 class="section-title">👥 Player Valuations</h2>
            
            <div class="filter-bar">
                <input type="text" id="searchPlayer" placeholder="🔍 Search players..." style="flex: 1; min-width: 200px;">
                <select id="filterPosition">
                    <option value="">All Positions</option>
                </select>
                <select id="sortPlayers">
                    <option value="valuation">Sort by Valuation</option>
                    <option value="name">Sort by Name</option>
                    <option value="position">Sort by Position</option>
                </select>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>Position</th>
                            <th>Valuation</th>
                            <th>Efficiency 1</th>
                            <th>Efficiency 2</th>
                            <th>2025 Weight</th>
                        </tr>
                    </thead>
                    <tbody id="playersTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const teamId = window.location.pathname.split('/').pop();
        let teamData = null;
        let playersData = [];
        let positionsData = [];

        async function loadTeamData() {
            try {
                // Load team summary
                const teamResponse = await fetch(`/api/nil/team/${teamId}`);
                teamData = await teamResponse.json();
                
                // Load players
                const playersResponse = await fetch(`/api/nil/team/${teamId}/players`);
                const playersJson = await playersResponse.json();
                playersData = playersJson.players || [];
                
                // Load position groups
                const positionsResponse = await fetch(`/api/nil/team/${teamId}/positions`);
                const positionsJson = await positionsResponse.json();
                positionsData = positionsJson.positions || [];
                
                renderTeamHeader();
                renderPositionBreakdown();
                renderPlayers();
                populatePositionFilter();
                
            } catch (error) {
                console.error('Error loading team data:', error);
                document.getElementById('teamHeader').innerHTML = `
                    <div class="loading">Error loading team data. Please try again.</div>
                `;
            }
        }

        function renderTeamHeader() {
            document.getElementById('teamHeader').innerHTML = `
                <h1 class="team-name">${teamData.team_name}</h1>
                
                <div class="team-stats-grid">
                    <div class="stat-box primary">
                        <div class="stat-value">$${(teamData.total_valuation / 1000).toFixed(1)}K</div>
                        <div class="stat-label">Total NIL Valuation</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">${teamData.total_players}</div>
                        <div class="stat-label">Total Players</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">$${Math.round(teamData.avg_valuation)}</div>
                        <div class="stat-label">Avg Per Player</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">$${(teamData.qb_valuation / 1000).toFixed(1)}K</div>
                        <div class="stat-label">QB Valuation</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">$${(teamData.rb_valuation / 1000).toFixed(1)}K</div>
                        <div class="stat-label">RB Valuation</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">$${(teamData.wr_valuation / 1000).toFixed(1)}K</div>
                        <div class="stat-label">WR Valuation</div>
                    </div>
                </div>
            `;
        }

        function renderPositionBreakdown() {
            const section = document.getElementById('positionBreakdown');
            section.style.display = 'block';
            
            const grid = document.getElementById('positionGrid');
            grid.innerHTML = positionsData.map(pos => `
                <div class="position-card">
                    <div class="position-name">${pos.position}</div>
                    <div class="position-stats">
                        <div class="position-stat-row">
                            <span class="position-stat-label">Total Valuation</span>
                            <span class="position-stat-value">$${(pos.total_valuation / 1000).toFixed(1)}K</span>
                        </div>
                        <div class="position-stat-row">
                            <span class="position-stat-label">Players</span>
                            <span class="position-stat-value">${pos.total_players}</span>
                        </div>
                        <div class="position-stat-row">
                            <span class="position-stat-label">Avg Valuation</span>
                            <span class="position-stat-value">$${Math.round(pos.avg_valuation)}</span>
                        </div>
                        <div class="position-stat-row">
                            <span class="position-stat-label">Avg Efficiency 1</span>
                            <span class="position-stat-value">${(pos.avg_eff1 * 100).toFixed(1)}%</span>
                        </div>
                        <div class="position-stat-row">
                            <span class="position-stat-label">Avg Efficiency 2</span>
                            <span class="position-stat-value">${(pos.avg_eff2 * 100).toFixed(1)}%</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderPlayers(filtered = null) {
            const section = document.getElementById('playersSection');
            section.style.display = 'block';
            
            const players = filtered || playersData;
            const tbody = document.getElementById('playersTable');
            
            tbody.innerHTML = players.map((player, index) => `
                <tr>
                    <td><span class="rank-badge">${index + 1}</span></td>
                    <td class="player-name">${player.player_name === '---' ? 'Backup' : player.player_name}</td>
                    <td><span class="position-badge">${player.position}</span></td>
                    <td class="valuation-badge">$${player.valuation.toLocaleString()}</td>
                    <td>
                        <div>${player.eff1 ? (player.eff1 * 100).toFixed(1) + '%' : '-'}</div>
                        ${player.eff1 ? `<div class="efficiency-bar"><div class="efficiency-fill" style="width: ${player.eff1 * 100}%"></div></div>` : ''}
                    </td>
                    <td>
                        <div>${player.eff2 ? (player.eff2 * 100).toFixed(1) + '%' : '-'}</div>
                        ${player.eff2 ? `<div class="efficiency-bar"><div class="efficiency-fill" style="width: ${player.eff2 * 100}%"></div></div>` : ''}
                    </td>
                    <td>${player.weight_2025 ? (player.weight_2025 * 100).toFixed(1) + '%' : '-'}</td>
                </tr>
            `).join('');
        }

        function populatePositionFilter() {
            const select = document.getElementById('filterPosition');
            const positions = [...new Set(playersData.map(p => p.position))].sort();
            
            select.innerHTML = '<option value="">All Positions</option>' + 
                positions.map(pos => `<option value="${pos}">${pos}</option>`).join('');
        }

        // Filter and sort functionality
        document.getElementById('searchPlayer').addEventListener('input', applyFilters);
        document.getElementById('filterPosition').addEventListener('change', applyFilters);
        document.getElementById('sortPlayers').addEventListener('change', applyFilters);

        function applyFilters() {
            const search = document.getElementById('searchPlayer').value.toLowerCase();
            const position = document.getElementById('filterPosition').value;
            const sortBy = document.getElementById('sortPlayers').value;

            let filtered = playersData.filter(player => {
                const matchesSearch = player.player_name.toLowerCase().includes(search);
                const matchesPosition = !position || player.position === position;
                return matchesSearch && matchesPosition;
            });

            // Sort
            switch(sortBy) {
                case 'valuation':
                    filtered.sort((a, b) => b.valuation - a.valuation);
                    break;
                case 'name':
                    filtered.sort((a, b) => a.player_name.localeCompare(b.player_name));
                    break;
                case 'position':
                    filtered.sort((a, b) => a.position.localeCompare(b.position));
                    break;
            }

            renderPlayers(filtered);
        }

        loadTeamData();
    </script>
</body>
</html>
