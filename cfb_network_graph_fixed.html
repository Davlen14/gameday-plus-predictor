<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Football 2025 Network Graph</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/networkgraph.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f1419;
            color: #e8eaed;
            margin: 0;
            padding: 20px;
        }
        
        .highcharts-figure {
            min-width: 320px;
            max-width: 1400px;
            margin: 1em auto;
        }
        
        #container {
            height: 900px;
        }
        
        .highcharts-description {
            margin: 0.3rem 10px;
            font-size: 0.95em;
            line-height: 1.6;
        }
        
        .view-controls {
            text-align: center;
            margin: 20px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            max-width: 1200px;
        }
        
        .view-controls h3 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        .view-button {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }
        
        .view-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #FFD700;
        }
        
        .view-button.active {
            background: #FFD700;
            color: #0f1419;
            border-color: #FFD700;
            font-weight: bold;
        }
        
        h1 {
            text-align: center;
            color: #fff;
            font-size: 2.5em;
            margin-bottom: 0.2em;
        }
        
        .subtitle {
            text-align: center;
            color: #9aa0a6;
            font-size: 1.1em;
            margin-bottom: 2em;
        }
    </style>
</head>
<body>
    <h1>🏈 College Football 2025</h1>
    <p class="subtitle">Conference Structure & Team Performance Network</p>
    
    <div class="view-controls">
        <h3>View Network By:</h3>
        <button class="view-button active" onclick="switchView('conference')">Conference Structure</button>
        <button class="view-button" onclick="switchView('performance')">Performance Tiers</button>
        <button class="view-button" onclick="switchView('offense')">Offensive Power</button>
        <button class="view-button" onclick="switchView('defense')">Defensive Power</button>
        <button class="view-button" onclick="switchView('style')">Playing Style</button>
    </div>
    
    <figure class="highcharts-figure">
        <div id="container"></div>
        <p class="highcharts-description">
            Interactive network graph showing FBS college football structure. Click buttons above to reorganize by different metrics.
            Drag nodes to explore. Hover for detailed stats.
        </p>
    </figure>

    <script>
        var currentView = 'conference';
        var chart = null;
        
        // Team data with metrics
        var teamData = {
            'Alabama': { perf: 3.17, conf: 'SEC', offense: 4.27, defense: 4.45, style: 'explosive' },
            'Georgia': { perf: 3.0, conf: 'SEC', offense: 4.81, defense: 3.66, style: 'explosive' },
            'LSU': { perf: 2.9, conf: 'SEC', offense: 3.2, defense: 2.98, style: 'balanced' },
            'Florida': { perf: 2.87, conf: 'SEC', offense: 4.0, defense: 3.46, style: 'balanced' },
            'Indiana': { perf: 3.07, conf: 'Big Ten', offense: 4.98, defense: 1.82, style: 'explosive' },
            'Iowa': { perf: 3.26, conf: 'Big Ten', offense: 4.39, defense: 3.27, style: 'defensive' },
            'Michigan': { perf: 3.08, conf: 'Big Ten', offense: 3.67, defense: 3.27, style: 'balanced' },
            'Ohio State': { perf: 3.5, conf: 'Big Ten', offense: 4.9, defense: 4.2, style: 'explosive' },
            'Clemson': { perf: 2.88, conf: 'ACC', offense: 3.92, defense: 2.69, style: 'balanced' },
            'Florida State': { perf: 3.37, conf: 'ACC', offense: 3.95, defense: 4.12, style: 'explosive' },
            'Miami': { perf: 2.86, conf: 'ACC', offense: 4.62, defense: 2.62, style: 'explosive' },
            'BYU': { perf: 3.1, conf: 'Big 12', offense: 4.04, defense: 3.06, style: 'balanced' },
            'Kansas State': { perf: 3.26, conf: 'Big 12', offense: 4.15, defense: 3.45, style: 'balanced' },
            'Boise State': { perf: 3.02, conf: 'Mountain West', offense: 3.7, defense: 3.14, style: 'balanced' },
            'App State': { perf: 3.06, conf: 'Sun Belt', offense: 3.69, defense: 3.63, style: 'balanced' }
        };

        function getDataForView(view) {
            var data = [];
            var rootNode = 'FBS 2025';
            
            if (view === 'conference') {
                var conferences = ['SEC', 'Big Ten', 'ACC', 'Big 12', 'Mountain West', 'Sun Belt'];
                conferences.forEach(function(conf) {
                    data.push([rootNode, conf]);
                });
                
                Object.keys(teamData).forEach(function(team) {
                    data.push([teamData[team].conf, team, teamData[team].perf]);
                });
                
            } else if (view === 'performance') {
                data.push([rootNode, 'Elite (3.2+)']);
                data.push([rootNode, 'Strong (3.0-3.19)']);
                data.push([rootNode, 'Average (<3.0)']);
                
                Object.keys(teamData).forEach(function(team) {
                    var perf = teamData[team].perf;
                    if (perf >= 3.2) {
                        data.push(['Elite (3.2+)', team, perf]);
                    } else if (perf >= 3.0) {
                        data.push(['Strong (3.0-3.19)', team, perf]);
                    } else {
                        data.push(['Average (<3.0)', team, perf]);
                    }
                });
                
            } else if (view === 'offense') {
                data.push([rootNode, 'Elite Offense (4.5+)']);
                data.push([rootNode, 'Strong Offense (4.0-4.49)']);
                data.push([rootNode, 'Average Offense (<4.0)']);
                
                Object.keys(teamData).forEach(function(team) {
                    var off = teamData[team].offense;
                    if (off >= 4.5) {
                        data.push(['Elite Offense (4.5+)', team, teamData[team].perf]);
                    } else if (off >= 4.0) {
                        data.push(['Strong Offense (4.0-4.49)', team, teamData[team].perf]);
                    } else {
                        data.push(['Average Offense (<4.0)', team, teamData[team].perf]);
                    }
                });
                
            } else if (view === 'defense') {
                data.push([rootNode, 'Elite Defense (4.0+)']);
                data.push([rootNode, 'Strong Defense (3.0-3.99)']);
                data.push([rootNode, 'Average Defense (<3.0)']);
                
                Object.keys(teamData).forEach(function(team) {
                    var def = teamData[team].defense;
                    if (def >= 4.0) {
                        data.push(['Elite Defense (4.0+)', team, teamData[team].perf]);
                    } else if (def >= 3.0) {
                        data.push(['Strong Defense (3.0-3.99)', team, teamData[team].perf]);
                    } else {
                        data.push(['Average Defense (<3.0)', team, teamData[team].perf]);
                    }
                });
                
            } else if (view === 'style') {
                data.push([rootNode, 'Explosive Style']);
                data.push([rootNode, 'Balanced Style']);
                data.push([rootNode, 'Defensive Style']);
                
                Object.keys(teamData).forEach(function(team) {
                    var style = teamData[team].style;
                    if (style === 'explosive') {
                        data.push(['Explosive Style', team, teamData[team].perf]);
                    } else if (style === 'balanced') {
                        data.push(['Balanced Style', team, teamData[team].perf]);
                    } else {
                        data.push(['Defensive Style', team, teamData[team].perf]);
                    }
                });
            }
            
            return data;
        }

        function switchView(view) {
            currentView = view;
            
            document.querySelectorAll('.view-button').forEach(function(btn) {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            buildChart();
        }

        function buildChart() {
            var chartData = getDataForView(currentView);
            
            chart = Highcharts.chart('container', {
                chart: {
                    type: 'networkgraph',
                    height: '100%',
                    backgroundColor: '#0f1419'
                },
                title: {
                    text: ''
                },
                plotOptions: {
                    networkgraph: {
                        keys: ['from', 'to', 'performance'],
                        layoutAlgorithm: {
                            enableSimulation: true,
                            friction: -0.9,
                            linkLength: 100
                        },
                        link: {
                            color: 'rgba(255, 255, 255, 0.2)'
                        }
                    }
                },
                series: [{
                    dataLabels: {
                        enabled: true,
                        linkFormat: '',
                        style: {
                            fontSize: '11px',
                            fontWeight: 'normal',
                            color: '#e8eaed',
                            textOutline: '1px #0f1419'
                        }
                    },
                    id: 'cfb-network',
                    data: chartData,
                    nodes: getNodes(chartData)
                }],
                tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.85)',
                    borderColor: '#666',
                    style: {
                        color: '#fff'
                    },
                    formatter: function() {
                        var team = teamData[this.point.id];
                        if (team) {
                            return '<b>' + this.point.id + '</b><br/>' + 
                                   'Conference: ' + team.conf + '<br/>' +
                                   'Performance: ' + team.perf.toFixed(2) + '<br/>' + 
                                   'Offense: ' + team.offense.toFixed(2) + '<br/>' + 
                                   'Defense: ' + team.defense.toFixed(2) + '<br/>' + 
                                   'Style: ' + team.style;
                        }
                        return '<b>' + this.point.id + '</b>';
                    }
                }
            });
        }
        
        function getNodes(data) {
            var colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F'];
            var nodes = {};
            var colorIndex = 0;
            
            data.forEach(function(link) {
                if (!nodes[link[0]]) {
                    nodes[link[0]] = {
                        id: link[0],
                        marker: { radius: link[0].includes('FBS') ? 25 : 15 },
                        color: link[0].includes('FBS') ? '#FFD700' : colors[colorIndex++ % colors.length]
                    };
                }
                if (!nodes[link[1]]) {
                    var perf = link[2] || 3;
                    nodes[link[1]] = {
                        id: link[1],
                        marker: { radius: teamData[link[1]] ? 5 + (perf * 2) : 12 },
                        color: nodes[link[0]].color
                    };
                }
            });
            
            return Object.values(nodes);
        }
        
        // Initialize
        buildChart();
    </script>
</body>
</html>
